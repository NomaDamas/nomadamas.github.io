# Pages CMS 설정. app.pagescms.org에 GitHub으로 로그인하면 이 파일을 읽어
# 브라우저에서 글을 쓰고 이미지를 드래그해 올릴 수 있다. 저장하면 이 저장소에 바로 커밋된다.
#
# 이미지 경로가 핵심이다. output이 src/ 안을 가리켜야 Astro가 빌드할 때 webp로 변환한다.
# public/ 아래를 가리키면 최적화 없이 원본이 그대로 나간다.
# AstroPaper는 마크다운에서 @/ 별칭을 쓴다(src/content/pages/about.md 참고).

media:
  input: src/assets/images
  output: '@/assets/images'
  categories: [image]
  extensions: [png, jpg, jpeg, webp, svg]

content:
  - name: posts
    label: 글
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      sort: pubDatetime
      order: desc
      fields: [title, pubDatetime, tags]
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: description
        label: 요약
        type: text
        required: true
        description: 검색 결과와 공유 카드에 그대로 나오는 문장이다. 한두 문장으로 쓴다.
      - name: pubDatetime
        label: 발행 시각
        type: date
        required: true
      - name: modDatetime
        label: 수정 시각
        type: date
      - name: tags
        label: 태그
        type: string
        list: true
      - name: featured
        label: 먼저 읽어보세요에 올리기
        type: boolean
      - name: draft
        label: 초안 (발행 안 함)
        type: boolean
      - name: ogImage
        label: 공유 이미지
        type: image
        description: 비워두면 제목으로 자동 생성된다.
      - name: body
        label: 본문
        type: rich-text

  - name: pages
    label: 고정 페이지
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: description
        label: 요약
        type: text
      - name: body
        label: 본문
        type: rich-text
